type Note {
  noteId: ID!
  title: String!
  content: String!
  category: String

  images: [String]
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Group {
  groupId: ID!
  name: String!
  color: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

input CreateNoteInput {
  title: String!
  content: String!
  category: String

  images: [String]
}

input UpdateNoteInput {
  title: String
  content: String
  category: String

  images: [String]
}

input CreateGroupInput {
  name: String!
  color: String
}

input UpdateGroupInput {
  name: String
  color: String
}

type TodoItem {
  id: String!
  text: String!
  completed: Boolean!
  createdAt: AWSDateTime!
}

type UserSettings {
  examDate: String
  todos: [TodoItem]
  updatedAt: AWSDateTime!
}

input TodoItemInput {
  id: String!
  text: String!
  completed: Boolean!
  createdAt: AWSDateTime!
}

input SaveUserSettingsInput {
  examDate: String
  todos: [TodoItemInput]
}

type Video {
  videoId: ID!
  title: String!
  description: String
  category: String!
  s3Key: String!
  thumbnailKey: String
  duration: Int
  order: Int
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

input CreateVideoInput {
  title: String!
  description: String
  category: String!
  s3Key: String!
  thumbnailKey: String
  duration: Int
  order: Int
}

input UpdateVideoInput {
  title: String
  description: String
  category: String
  s3Key: String
  thumbnailKey: String
  duration: Int
  order: Int
}

type VideoProgress {
  videoId: ID!
  progressSeconds: Int!
  duration: Int
  completed: Boolean!
  notes: String
  lastWatchedAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

input SaveVideoProgressInput {
  videoId: ID!
  progressSeconds: Int!
  duration: Int
  completed: Boolean
  notes: String
}

type KeyConcept {
  conceptId: ID!
  topic: String!
  rule: String!
  notes: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

input CreateKeyConceptInput {
  topic: String!
  rule: String!
}

input KeyConceptNoteInput {
  question: String!
  answer: String!
}

input UpdateKeyConceptInput {
  notes: String
}

type NotesConnection {
  items: [Note]
  nextToken: String
}

type Query {
  getNotes(limit: Int, nextToken: String): NotesConnection
  getNote(noteId: ID!): Note
  getGroups: [Group]
  getGroup(groupId: ID!): Group
  getUserSettings: UserSettings
  getVideos: [Video]
  getVideo(videoId: ID!): Video
  getVideosByCategory(category: String!): [Video]
  getVideoProgress(videoId: ID!): VideoProgress
  getVideoProgressList: [VideoProgress]
  getKeyConcepts: [KeyConcept]
  getKeyConcept(conceptId: ID!): KeyConcept
}

type Mutation {
  createNote(input: CreateNoteInput!): Note
  updateNote(noteId: ID!, input: UpdateNoteInput!): Note
  deleteNote(noteId: ID!): Boolean
  createGroup(input: CreateGroupInput!): Group
  updateGroup(groupId: ID!, input: UpdateGroupInput!): Group
  deleteGroup(groupId: ID!): Boolean
  saveUserSettings(input: SaveUserSettingsInput!): UserSettings
  createVideo(input: CreateVideoInput!): Video
  updateVideo(videoId: ID!, input: UpdateVideoInput!): Video
  deleteVideo(videoId: ID!): Boolean
  saveVideoProgress(input: SaveVideoProgressInput!): VideoProgress
  createKeyConcept(input: CreateKeyConceptInput!): KeyConcept
  updateKeyConcept(conceptId: ID!, input: UpdateKeyConceptInput!): KeyConcept
  deleteKeyConcept(conceptId: ID!): Boolean
}
